<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Quiz</h1>

        <div id="category">カテゴリ</div>
        <select id="categorySelect">
            <option value="all">すべて</option>
        </select>

        <div id="question">
            問題を取得中...
        </div>

        <input
            id="answer"
            type="text"
            placeholder="答えを入力">

        <button id="submit">
            回答する
        </button>
        <button id="hint">ヒント</button>

        <div id="result"></div>

        <button id="next">
            次の問題
        </button>
        <button id="home">
            ホームに戻る
        </button>

        <button id="logout">
            ログアウト
        </button>

    </div>
    <div class="chat">

        <h3>💬 チャット</h3>

        <div id="messages"></div>

        <input
            id="chatInput"
            type="text"
            placeholder="メッセージ">

        <button id="sendChat">
            送信
        </button>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>

</body>
</html>
