<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Quiz</h1>

        <div id="category">カテゴリ</div>
        <select id="categorySelect">
            <option value="all">すべて</option>
        </select>

        <div id="question">
            問題を取得中...
        </div>

        <input
            id="answer"
            type="text"
            placeholder="答えを入力">

        <button id="submit">
            回答する
        </button>
        <button id="hint">ヒント</button>

        <div id="result"></div>

        <button id="next">
            次の問題
        </button>

    </div>

    <script src="app.js"></script>

</body>
</html>
