<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マイページ</title>
<!-- Supabase本体 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Google Fonts（手書き風） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mypage.css">
<!-- 自分のJS -->
<script src="supabase.js"></script>
<script src="idle-logout.js"></script>
<script src="mypage.js" defer></script>
</head>
<body>
<button id="homeBtn" class="home-btn">🏠 ホームに戻る</button>

<div class="notebook">

    <div class="notebook-spiral">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="notebook-page">

        <h2 class="page-title">
            📊 教科別正答率・📈 日別記録
            <button id="resetStatsBtn" class="reset-btn">記録をリセット</button>
        </h2>
        <div class="chart-box">
            <canvas id="categoryChart"></canvas>
        </div>

        <div class="chart-box">
            <canvas id="dailyChart"></canvas>
        </div>

        <h2 class="page-title">📝 テストの点数記録</h2>
        <div id="testScoreSection">
            <div class="chart-box">
                <canvas id="testScoreChart"></canvas>
            </div>
            <div class="score-form">
                <div class="score-form-row">
                    <input type="text" id="scoreSubject" placeholder="教科名（例: 数学）" maxlength="20">
                    <input type="number" id="scoreValue" placeholder="点数" min="0" max="100">
                    <select id="scoreTerm">
                        <option value="1学期中間">1学期中間</option>
                        <option value="1学期末">1学期末</option>
                        <option value="2学期中間">2学期中間</option>
                        <option value="2学期末">2学期末</option>
                        <option value="学年末">学年末</option>
                    </select>
                    <button id="scoreAddBtn">追加</button>
                </div>
                <p class="form-msg" id="scoreFormMsg"></p>
                <ul class="score-entry-list" id="scoreEntryList"></ul>
            </div>
        </div>

        <h2 class="page-title">⭐ ブックマーク一覧</h2>
        <div id="bookmarkContainer" class="bookmark-container">
            <p class="empty-message" id="bookmarkEmpty" style="display:none;">
                まだブックマークがありません。
            </p>
        </div>

    </div>

</div>

</body>
</html>
