<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master | プロフィール</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
    --paper:       #F5F3EC;
    --paper-line:  #DAD4C4;
    --margin-red:  #D99A94;
    --ink:         #232A35;
    --ink-soft:    #6B7280;
    --red-pen:     #C6423A;
    --red-pen-soft:#E2857D;
    --navy:        #2E3E5C;
    --gold:        #B8912E;
    --gold-soft:   #E4CB86;
    --sage:        #52745A;
    --card-bg:     #FFFFFE;
    --shadow:      rgba(35,42,53,.10);
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:"Zen Kaku Gothic New", sans-serif;
    color:var(--ink);
    background:
        repeating-linear-gradient(
            var(--paper) 0px, var(--paper) 35px,
            var(--paper-line) 36px, var(--paper) 37px
        );
    min-height:100vh;
}

img{ max-width:100%; display:block; }

/* ===== ヘッダー（toppage/premiumと共通デザイン） ===== */

header{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(245,243,236,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px dashed var(--paper-line);
    padding:16px clamp(20px,6vw,56px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
}

.logo{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:"Zen Old Mincho", serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    letter-spacing:.02em;
}
.logo .accent{ position:relative; display:inline-block; }
.logo .accent svg{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:120%; height:170%;
    overflow:visible;
}
.logo .accent path{ fill:none; stroke:var(--red-pen); stroke-width:3.5; stroke-linecap:round; }

nav{ display:flex; gap:8px; flex-wrap:wrap; }
nav button{
    font-family:"Zen Kaku Gothic New", sans-serif;
    background:transparent;
    border:1px solid transparent;
    color:var(--ink);
    cursor:pointer;
    font-size:14.5px;
    font-weight:700;
    padding:9px 16px;
    border-radius:3px;
    transition:.2s;
}
nav button:hover{ border-color:var(--paper-line); background:#fff; }
nav button:focus-visible{ outline:2px solid var(--red-pen); outline-offset:2px; }
nav button.tab-logout{ color:var(--ink-soft); }
nav button.is-current{ color:var(--gold); border-color:var(--gold-soft); background:#FBF6E7; }

/* ===== ページ本体 ===== */

.wrap{
    width:92%;
    max-width:720px;
    margin:0 auto;
    padding:44px 0 80px;
}

.back-link{
    display:inline-block;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:20px;
}
.back-link:hover{ color:var(--red-pen); }

.profile-sheet{
    background:var(--card-bg);
    border:1px solid var(--paper-line);
    box-shadow:0 14px 34px var(--shadow);
    padding:clamp(24px,5vw,48px);
}

.profile-head{
    text-align:center;
    margin-bottom:8px;
}
.profile-name-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}
#profileName{
    font-family:"Zen Old Mincho", serif;
    font-size:24px;
    font-weight:700;
}
.grade-badge{
    font-family:"Klee One", cursive;
    font-size:13px;
    color:var(--navy);
    border:1px solid var(--navy);
    border-radius:4px;
    padding:2px 10px;
    transform:rotate(-2deg);
}

/* ===== コメント吹き出し ===== */

.profile-stage{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.comment-bubble{
    position:relative;
    max-width:340px;
    background:var(--card-bg);
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:12px 18px;
    margin-bottom:26px;
    display:flex;
    align-items:center;
    gap:8px;
}
.comment-bubble::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-9px;
    transform:translateX(-50%);
    width:14px; height:14px;
    background:var(--card-bg);
    border-right:1px solid var(--paper-line);
    border-bottom:1px solid var(--paper-line);
    rotate:45deg;
}
#commentText{
    font-family:"Klee One", cursive;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
}
#commentText.is-placeholder{ color:var(--ink-soft); }

.edit-pencil{
    flex-shrink:0;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--paper-line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
.edit-pencil:hover{ border-color:var(--red-pen); color:var(--red-pen); }

/* ===== 中央: アバター + 左右コレクション ===== */

.stage-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,3vw,26px);
}

.collection-col{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.collection-slot{
    width:58px; height:58px;
    border:1.5px dashed var(--paper-line);
    border-radius:6px;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
}
.collection-slot.is-locked{ color:var(--ink-soft); }
.collection-slot.is-unlocked{
    border-style:solid;
    border-color:var(--gold-soft, var(--gold));
    background:#FBF6E7;
    padding:4px;
}
.slot-img{ width:100%; height:32px; object-fit:contain; }
.slot-lock{ font-size:15px; opacity:.7; }
.slot-label{ font-size:9.5px; font-weight:700; letter-spacing:.02em; text-align:center; line-height:1.2; }

.avatar-frame{
    position:relative;
    background:#fff;
    padding:10px 10px 22px;
    box-shadow:0 10px 22px var(--shadow);
    transform:rotate(-1.2deg);
}
.avatar-frame::before{
    content:"";
    position:absolute;
    top:-10px; left:50%;
    transform:translateX(-50%) rotate(-3deg);
    width:64px; height:20px;
    background:rgba(184,145,46,.35);
}

.avatar-photo{
    width:clamp(120px,30vw,150px);
    height:clamp(120px,30vw,150px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
.avatar-photo img{ width:100%; height:100%; object-fit:cover; }
.avatar-fallback{ font-size:clamp(50px,12vw,64px); }

.avatar-edit{
    position:absolute;
    right:2px; bottom:12px;
    background:var(--card-bg);
    box-shadow:0 2px 6px var(--shadow);
}

/* ===== アバター選択パネル ===== */

.avatar-picker, .comment-editor{
    margin-top:24px;
    padding:18px;
    border:1px solid var(--paper-line);
    background:var(--paper);
}
.picker-title{
    font-size:13.5px;
    font-weight:700;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
}
.picker-sub{
    font-family:"Klee One", cursive;
    font-size:11.5px;
    color:var(--gold);
    border:1px solid var(--gold-soft);
    border-radius:3px;
    padding:1px 8px;
}
.picker-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:14px;
}
.picker-item{
    aspect-ratio:1;
    border:1px solid var(--paper-line);
    border-radius:8px;
    font-size:24px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}
.picker-item:hover{ border-color:var(--red-pen); }
.picker-item img{ width:100%; height:100%; object-fit:cover; border-radius:8px; }
.picker-empty{ grid-column:1/-1; font-size:13px; color:var(--ink-soft); text-align:center; padding:8px 0; }

#commentInput{
    width:100%;
    min-height:70px;
    resize:vertical;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:14.5px;
    padding:10px;
    border:1px solid var(--paper-line);
    background:var(--card-bg);
    color:var(--ink);
    margin-bottom:12px;
}
#commentInput:focus{ outline:none; border-color:var(--red-pen); }

.editor-actions{ display:flex; gap:10px; align-items:center; }

.btn-stamp--sm{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:900;
    font-size:13.5px;
    color:#fff;
    background:var(--red-pen);
    border:none;
    padding:9px 18px;
    border-radius:2px;
    cursor:pointer;
    box-shadow:2px 2px 0 var(--ink);
}
.btn-stamp--sm:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 var(--ink); }

.btn-outline{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--paper-line);
    padding:8px 16px;
    border-radius:2px;
    cursor:pointer;
}
.btn-outline:hover{ border-color:var(--ink); }

.btn-text{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    text-decoration:underline;
    cursor:pointer;
}
.btn-text:hover{ color:var(--red-pen); }

.premium-hint{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:22px;
    padding-top:18px;
    border-top:1px dashed var(--paper-line);
}
.premium-hint a{ color:var(--red-pen); font-weight:700; }

/* ===== 下部ステータス ===== */

.profile-stats{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-top:34px;
    padding-top:28px;
    border-top:1px dashed var(--paper-line);
}
.stat-card{
    text-align:center;
    background:var(--paper);
    border:1px solid var(--paper-line);
    border-top:3px solid var(--navy);
    padding:16px 8px;
}
.stat-card h3{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:8px;
}
.stat-card p{
    font-family:"Zen Old Mincho", serif;
    font-size:26px;
    font-weight:700;
    color:var(--ink);
}
.stat-card p .unit{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
}
.stat-card.is-rate{ border-top-color:var(--red-pen); }
.stat-card.is-rate p{ color:var(--red-pen); }

@media (max-width:480px){
    .stage-row{ gap:8px; }
    .collection-slot{ width:44px; height:44px; }
    .slot-label{ font-size:8px; }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="toppage.html">
        <span>Quiz</span>
        <span class="accent">Master
            <svg viewBox="0 0 100 40"><path d="M6,20 C4,7 30,2 55,3 C82,4 96,10 94,21 C92,33 62,38 34,36 C10,34 3,28 8,19"/></svg>
        </span>
    </a>
    <nav>
        <button onclick="location.href='index.html'">クイズ</button>
        <button onclick="location.href='mypage.html'">マイページ</button>
        <button class="is-current" onclick="location.href='profile.html'">プロフィール</button>
        <button onclick="location.href='premium.html'">Premium</button>
        <button id="logout" class="tab-logout">ログアウト</button>
    </nav>
</header>

<main class="wrap">

    <a id="backLink" class="back-link" href="toppage.html">← ホームに戻る</a>

    <div class="profile-sheet">

        <div class="profile-head">
            <div class="profile-name-row">
                <h1 id="profileName">読み込み中...</h1>
                <span id="profileGrade" class="grade-badge"></span>
            </div>
        </div>

        <div class="profile-stage">

            <div class="comment-bubble" id="commentBubble">
                <p id="commentText"></p>
                <button id="editCommentBtn" class="edit-pencil" title="コメントを編集" hidden>✎</button>
            </div>

            <div class="stage-row">
                <div class="collection-col" id="collectionLeft"></div>

                <div class="avatar-frame">
                    <div class="avatar-photo" id="avatarPhoto"></div>
                    <button id="editAvatarBtn" class="edit-pencil avatar-edit" title="写真を変更" hidden>✎</button>
                </div>

                <div class="collection-col" id="collectionRight"></div>
            </div>

        </div>

        <!-- アバター選択パネル（Premiumのみ、自分のプロフィールでのみ表示） -->
        <div class="avatar-picker" id="avatarPicker" hidden>
            <p class="picker-title">写真を選ぶ<span class="picker-sub">Premium限定</span></p>
            <div class="picker-grid" id="pickerGrid"></div>
            <button class="btn-outline" id="closePickerBtn">閉じる</button>
        </div>

        <!-- コメント編集パネル -->
        <div class="comment-editor" id="commentEditor" hidden>
            <textarea id="commentInput" maxlength="40" placeholder="ひとことコメント（40文字まで）"></textarea>
            <div class="editor-actions">
                <button class="btn-stamp--sm" id="saveCommentBtn">保存する</button>
                <button class="btn-text" id="cancelCommentBtn">キャンセル</button>
            </div>
        </div>

        <p class="premium-hint" id="premiumHint" hidden>
            🔒 写真・コメント・コレクションの編集はPremiumプラン限定の機能です。<a href="premium.html">くわしく見る</a>
        </p>

        <div class="profile-stats">
            <div class="stat-card">
                <h3>総回答数</h3>
                <p id="statTotal">0<span class="unit">問</span></p>
            </div>
            <div class="stat-card">
                <h3>正解数</h3>
                <p id="statCorrect">0<span class="unit">問</span></p>
            </div>
            <div class="stat-card is-rate">
                <h3>正答率</h3>
                <p id="statRate">0<span class="unit">%</span></p>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="idle-logout.js"></script>
<script src="profile.js"></script>

<script>
document.getElementById("logout").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    location.href = "login.html";
});
</script>

</body>
</html>
