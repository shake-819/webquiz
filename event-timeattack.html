<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master | タイムアタッククイズ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
    --paper:       #F5F3EC;
    --paper-line:  #DAD4C4;
    --ink:         #232A35;
    --ink-soft:    #6B7280;
    --red-pen:     #C6423A;
    --navy:        #2E3E5C;
    --gold:        #B8912E;
    --gold-soft:   #E4CB86;
    --sage:        #52745A;
    --card-bg:     #FFFFFE;
    --shadow:      rgba(35,42,53,.10);
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
    font-family:"Zen Kaku Gothic New", sans-serif;
    color:var(--ink);
    background:
        repeating-linear-gradient(
            var(--paper) 0px, var(--paper) 35px,
            var(--paper-line) 36px, var(--paper) 37px
        );
    min-height:100vh;
}

.back-link{
    display:inline-block;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    text-decoration:none;
    margin:20px 0 0 20px;
}
.back-link:hover{ color:var(--red-pen); }

.wrap{
    width:92%;
    max-width:620px;
    margin:0 auto;
    padding:20px 0 80px;
}

.event-sheet{
    background:var(--card-bg);
    border:1px solid var(--paper-line);
    box-shadow:0 14px 34px var(--shadow);
    padding:clamp(24px,5vw,40px);
}

/* ===== 見出し ===== */

.event-head{ text-align:center; margin-bottom:26px; }
.event-head .eyebrow{
    font-family:"Klee One", cursive;
    font-size:13px;
    color:var(--gold);
    border:1px solid var(--gold-soft);
    border-radius:4px;
    padding:2px 12px;
    display:inline-block;
    transform:rotate(-2deg);
    margin-bottom:10px;
}
.event-head h1{
    font-family:"Zen Old Mincho", serif;
    font-size:26px;
}
.event-head p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:8px;
}

/* ===== ボタン ===== */

button{
    font-family:"Zen Kaku Gothic New", sans-serif;
    cursor:pointer;
    border-radius:2px;
    transition:transform .15s ease, box-shadow .15s ease, background .2s, color .2s, border-color .2s;
}
button:focus-visible{ outline:2px solid var(--red-pen); outline-offset:2px; }

.btn-row{ display:flex; gap:12px; margin-bottom:6px; }
.btn-row--sub{ margin-top:6px; flex-wrap:wrap; }

.btn-stamp{
    flex:1;
    font-weight:900;
    font-size:16px;
    color:#fff;
    background:var(--red-pen);
    border:none;
    padding:14px 20px;
    box-shadow:3px 3px 0 var(--ink);
}
.btn-stamp:hover:not(:disabled){ transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }

.btn-outline{
    flex:1;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--paper-line);
    padding:12px 16px;
}
.btn-outline:hover{ border-color:var(--ink); background:var(--paper); }
.btn-outline.btn-navy{ color:var(--navy); border-color:var(--navy); }
.btn-outline.btn-navy:hover{ background:#EEF1F6; }

.btn-text{
    flex:0 0 auto;
    font-weight:700;
    font-size:13.5px;
    color:var(--ink-soft);
    background:transparent;
    border:none;
    padding:12px 10px;
    text-decoration:underline;
    text-underline-offset:3px;
}
.btn-text:hover{ color:var(--red-pen); }

button:disabled{ opacity:.45; cursor:not-allowed; box-shadow:none; }
button:disabled:hover{ transform:none; }

/* ===== スタート画面：制限時間 ===== */

.time-limit-box{
    background:var(--paper);
    border:1px solid var(--paper-line);
    padding:18px 24px;
    margin-bottom:24px;
    text-align:center;
}
.time-limit-box h3{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:4px;
}
.time-limit-box .big{
    font-family:"Zen Old Mincho", serif;
    font-size:40px;
    font-weight:700;
    color:var(--red-pen);
    line-height:1.2;
}
.time-limit-box .big .unit{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:15px;
    color:var(--ink-soft);
    margin-left:2px;
}

.rules{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.9;
    padding-top:18px;
    margin-bottom:24px;
    border-top:1px dashed var(--paper-line);
}
.rules li{ margin-left:1.1em; }

/* ===== プレイ画面：タイマー・スコア ===== */

.play-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:var(--paper);
    border:1px solid var(--paper-line);
    padding:12px 22px;
    margin-bottom:20px;
}
.play-bar .label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    display:block;
    margin-bottom:2px;
}

#timerBox{
    font-family:"Zen Old Mincho", serif;
    font-size:36px;
    font-weight:700;
    line-height:1.1;
    color:var(--navy);
    transition:color .2s;
}
#timerBox .unit{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    margin-left:2px;
}
#timerBox.is-low{
    color:var(--red-pen);
    animation:pulse 1s ease-in-out infinite;
}
@keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.55; }
}
@media (prefers-reduced-motion: reduce){
    #timerBox.is-low{ animation:none; }
}

.score-box{ text-align:right; }
#liveScore{
    font-family:"Zen Old Mincho", serif;
    font-size:36px;
    font-weight:700;
    line-height:1.1;
    color:var(--ink);
}
.score-box .unit{
    font-size:14px;
    color:var(--ink-soft);
    margin-left:2px;
}

/* ===== 問題シート ===== */

#qCategory{
    font-family:"Klee One", cursive;
    font-weight:600;
    font-size:14px;
    color:var(--red-pen);
    display:block;
    min-height:22px;
    margin-bottom:8px;
}

.question-sheet{
    background:
        repeating-linear-gradient(
            var(--card-bg) 0px, var(--card-bg) 33px,
            var(--paper-line) 34px, var(--card-bg) 35px
        );
    border:1px solid var(--paper-line);
    border-left:3px solid var(--navy);
    padding:22px 22px 26px;
    margin-bottom:22px;
}
.q-label{
    font-family:"Zen Old Mincho", serif;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:.14em;
    display:block;
    margin-bottom:10px;
}
#qText{
    font-family:"Zen Old Mincho", serif;
    font-size:19px;
    line-height:1.9;
    min-height:70px;
    color:var(--ink);
}

#answerInput{
    width:100%;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:17px;
    padding:12px 4px;
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    margin-bottom:12px;
    color:var(--ink);
}
#answerInput::placeholder{ color:#A9AFB8; }
#answerInput:focus{ outline:none; border-bottom-color:var(--red-pen); }

.flash{
    text-align:center;
    font-family:"Zen Old Mincho", serif;
    font-size:18px;
    font-weight:700;
    min-height:32px;
    margin:4px 0 14px;
    color:var(--ink-soft);
}
.flash.correct{ color:var(--sage); }
.flash.wrong{ color:var(--red-pen); }

/* ===== 結果画面 ===== */

.result-box{ text-align:center; margin-bottom:24px; }
.result-box h2{
    font-family:"Zen Old Mincho", serif;
    font-size:20px;
    margin-bottom:6px;
}
.result-score{
    font-family:"Zen Old Mincho", serif;
    font-size:64px;
    font-weight:700;
    color:var(--red-pen);
    line-height:1.2;
}
.result-score .unit{
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:18px;
    color:var(--ink-soft);
    margin-left:4px;
}
#bestNote{
    font-family:"Klee One", cursive;
    font-size:14.5px;
    color:var(--ink);
    margin-top:6px;
}
#unlockNote{
    display:none;
    font-size:13.5px;
    color:var(--gold);
    background:#FBF6E6;
    border:1px dashed var(--gold-soft);
    padding:10px 14px;
    margin-top:14px;
    line-height:1.7;
}

/* ===== ランキング ===== */

.leader-title{
    font-family:"Zen Old Mincho", serif;
    font-size:17px;
    margin:30px 0 12px;
    padding-top:22px;
    border-top:1px dashed var(--paper-line);
}

#leaderboard{ list-style:none; }
#leaderboard li{
    display:flex;
    justify-content:space-between;
    padding:11px 4px;
    border-bottom:1px dashed var(--paper-line);
    font-size:14.5px;
}
#leaderboard li:last-child{ border-bottom:none; }
#leaderboard li span{ font-weight:700; }
#leaderboard li.empty{ color:var(--ink-soft); justify-content:center; }
#leaderboard a:hover{ color:var(--red-pen) !important; }
</style>
</head>

<body>

<a class="back-link" href="toppage.html">← ホームに戻る</a>

<main class="wrap">
    <div class="event-sheet">

        <div class="event-head">
            <span class="eyebrow">EVENT</span>
            <h1>⏱️ タイムアタッククイズ</h1>
            <p>全カテゴリからランダム出題。時間内にたくさん正解しよう。</p>
        </div>

        <!-- ===== スタート画面 ===== -->
        <div id="startScreen">
            <div class="time-limit-box">
                <h3>制限時間</h3>
                <p class="big"><span data-time-limit>60</span><span class="unit">秒</span></p>
            </div>

            <ul class="rules">
                <li>制限時間は <span data-time-limit>60</span> 秒。全カテゴリからランダムに出題されます</li>
                <li>正解すると次の問題へ。不正解のときは同じ問題にもう一度答えられます</li>
                <li>スキップすると <span data-skip-penalty>5</span> 秒のペナルティで次の問題へ進みます</li>
                <li><span data-unlock-score>15</span> 問以上正解すると、限定アバターが解放されます</li>
                <li>自己ベストはランキングに反映されます</li>
            </ul>

            <div class="btn-row">
                <button id="startBtn" class="btn-stamp">スタート</button>
            </div>
        </div>

        <!-- ===== プレイ画面 ===== -->
        <div id="playScreen" style="display:none;">
            <div class="play-bar">
                <div>
                    <span class="label">残り時間</span>
                    <div id="timerBox">60<span class="unit">秒</span></div>
                </div>
                <div class="score-box">
                    <span class="label">正解数</span>
                    <div><span id="liveScore">0</span><span class="unit">問</span></div>
                </div>
            </div>

            <span id="qCategory"></span>

            <div class="question-sheet">
                <span class="q-label">問題</span>
                <div id="qText"></div>
            </div>

            <input
                id="answerInput"
                type="text"
                placeholder="ここに答えを書いてEnter"
                autocomplete="off">

            <div class="flash" id="flash"></div>

            <div class="btn-row btn-row--sub">
                <button id="skipBtn" class="btn-outline btn-navy">スキップ（-<span data-skip-penalty>5</span>秒）</button>
                <button id="retireBtn" class="btn-text">リタイア</button>
            </div>
        </div>

        <!-- ===== 結果画面 ===== -->
        <div id="resultScreen" style="display:none;">
            <div class="result-box">
                <h2>結果発表</h2>
                <p class="result-score"><span id="finalScore">0</span><span class="unit">問正解</span></p>
                <p id="bestNote"></p>
                <p id="unlockNote"></p>
            </div>

            <div class="btn-row">
                <button id="retryBtn" class="btn-stamp">もう一度挑戦</button>
            </div>
            <div class="btn-row btn-row--sub">
                <button id="homeBtn" class="btn-outline">ホームに戻る</button>
            </div>
        </div>

        <h2 class="leader-title">🏆 ランキング TOP10</h2>
        <ul id="leaderboard"></ul>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="idle-logout.js"></script>
<script src="event-timeattack.js"></script>

<script>
// 制限時間などの表示をJSの定数と自動で合わせる
document.querySelectorAll("[data-time-limit]").forEach(el => el.textContent = TIME_LIMIT);
document.querySelectorAll("[data-skip-penalty]").forEach(el => el.textContent = SKIP_PENALTY);
document.querySelectorAll("[data-unlock-score]").forEach(el => el.textContent = UNLOCK_SCORE);
document.getElementById("timerBox").innerHTML = `${TIME_LIMIT}<span class="unit">秒</span>`;
</script>

</body>
</html>
