<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Master | 新規登録</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">

        <a class="brand" href="index.html">
            <span>Quiz</span>
            <span class="brand-accent">Master
                <svg viewBox="0 0 100 40"><path d="M6,20 C4,7 30,2 55,3 C82,4 96,10 94,21 C92,33 62,38 34,36 C10,34 3,28 8,19"/></svg>
            </span>
        </a>

        <span class="auth-eyebrow">NEW NOTEBOOK</span>
        <h2>新規登録</h2>

        <div class="field">
            <label for="name">ユーザー名</label>
            <input id="name" type="text" placeholder="表示される名前">
        </div>

        <div class="field">
            <label for="email">メールアドレス</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>

        <div class="field">
            <label for="password">パスワード</label>
            <input id="password" type="password" placeholder="••••••••">
        </div>

        <button id="register">登録</button>

        <p class="switch">
            アカウントをお持ちの方は <a href="login.html">ログインはこちら</a>
        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>
</html>
