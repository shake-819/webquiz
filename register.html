<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}
.title{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    color:#0F52BA;
    font-size:50px;
    font-weight:bold;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
}
body{
    background-image:url("images/background.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    width:350px;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    text-align:center;
}

h2{
    margin-bottom:30px;
    color:#333;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
    transition:.2s;
}

input:focus{
    border-color:#4facfe;
    box-shadow:0 0 5px rgba(79,172,254,.5);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4facfe;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#2d8df5;
}

p{
    margin-top:20px;
}

a{
    color:#4facfe;
    text-decoration:none;
}

a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>
<h1 class="title">Web版 くいず</h1>

<div class="register-box">

<h2>新規登録</h2>

<input id="name" type="text" placeholder="ユーザー名">

<input id="email" type="email" placeholder="メールアドレス">

<input id="password" type="password" placeholder="パスワード">

<button id="register">
登録
</button>

<p>
<a href="login.html">ログインはこちら</a>
</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>
</html>
